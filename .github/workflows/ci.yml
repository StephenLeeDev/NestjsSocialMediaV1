# ============================================================================
#  CI: checks every pull request and every push to develop / master
# ============================================================================
#
# GitHub runs this file on its own servers ("runners") and shows the result
# on the pull request: a green check when every step passed, a red cross
# with the failing step's log otherwise.
#
# What it checks, in the same order a developer would locally:
#   1. lint:check    ESLint finds no problems (without auto-fixing them)
#   2. format:check  every file is formatted with Prettier
#   3. build         the TypeScript compiles (`nest build`)
#   4. test          the unit tests (*.spec.ts in src/)
#   5. test:e2e      the e2e tests (test/*.e2e-spec.ts) against a real,
#                    empty PostgreSQL started just for this run
#
# Nothing here needs secrets: the e2e tests bring their own test settings
# (test/setup-env.ts), and the database below is thrown away after the run.
# ============================================================================

name: CI

on:
  pull_request:
  push:
    branches: [develop, master]

# A newer push to the same branch / pull request cancels the run that is
# still going for the older commit: only the latest result matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The workflow only reads the repository (least privilege).
permissions:
  contents: read

jobs:
  test:
    name: Lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A PostgreSQL server that lives only for this job.
    # Its settings match the defaults in test/setup-env.ts, so the e2e tests
    # find it without any extra configuration:
    #   localhost:5432, user "postgres",
    #   database "social-media-app-v1-test" (the name MUST end with "-test";
    #   setup-env.ts refuses to run against anything else).
    #
    # No password: "trust" lets every connection in without one, exactly like
    # Postgres.app on a developer machine. That is safe here because the
    # server exists only inside this job's private network and is thrown away
    # afterwards. (A password written in this file would be flagged by secret
    # scanners such as GitGuardian, although it would protect nothing.)
    # The password the tests send (DB_PASSWORD in setup-env.ts) is ignored.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: social-media-app-v1-test
        ports:
          - 5432:5432
        # Wait until the database accepts connections before the steps run.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # The Node version comes from .nvmrc, the same file local version
      # managers (nvm, fnm, ...) read, so CI and laptops use the same major.
      # `cache: npm` reuses downloaded packages between runs (faster).
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` (not `npm install`): installs exactly what package-lock.json
      # says, and fails if the lock file and package.json disagree.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e
